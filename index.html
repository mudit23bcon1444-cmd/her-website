<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Heartbreak Reel – a cinematic, personal love letter in film." />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Heartbreak Reel</title>
  <link rel="stylesheet" href="style.css?v=2.0.3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ░░░  LOADER  ░░░ -->
  <div id="loader" aria-live="polite" aria-label="Loading…">
    <div class="loader-heart" aria-hidden="true">♥</div>
    <p class="loader-text">Loading your reel…</p>
    <div class="loader-bar"><div class="loader-fill" id="loaderFill"></div></div>
  </div>

  <!-- ░░░  MUTE BUTTON  ░░░ -->
  <button id="muteBtn" class="mute-btn" aria-label="Toggle mute" title="Toggle mute" hidden>
    <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <path id="soundWave1" d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      <path id="soundWave2" d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
    </svg>
  </button>

  <!-- ░░░  SCENE 1 – INTRO  ░░░ -->
  <section id="scene1" class="scene active" aria-label="Intro scene">

    <canvas id="dustCanvas" aria-hidden="true"></canvas>

    <!-- Person with bow (SVG silhouette) -->
    <div id="archer" class="archer" aria-hidden="true">
      <svg id="archerSvg" viewBox="0 0 120 260" xmlns="http://www.w3.org/2000/svg">
        <circle cx="60" cy="28" r="18" fill="#c8a882" />
        <ellipse cx="60" cy="14" rx="18" ry="8" fill="#3a1f0d" />
        <rect x="44" y="46" width="32" height="70" rx="8" fill="#7a3232" />
        <line x1="44" y1="70" x2="10" y2="90" stroke="#c8a882" stroke-width="8" stroke-linecap="round" />
        <line x1="76" y1="70" x2="105" y2="55" stroke="#c8a882" stroke-width="8" stroke-linecap="round" />
        <rect x="46" y="116" width="12" height="70" rx="6" fill="#3a1f0d" />
        <rect x="62" y="116" width="12" height="70" rx="6" fill="#3a1f0d" />
        <path d="M8 60 Q-10 90 8 120" fill="none" stroke="#8B5E3C" stroke-width="5" stroke-linecap="round"/>
        <line x1="8" y1="60" x2="10" y2="90" stroke="#e8d5b0" stroke-width="1.5"/>
        <line x1="10" y1="90" x2="8" y2="120" stroke="#e8d5b0" stroke-width="1.5"/>
        <line id="nockArrow" x1="10" y1="90" x2="100" y2="58" stroke="#8B5E3C" stroke-width="3" stroke-linecap="round"/>
        <polygon id="nockArrowHead" points="100,58 92,54 92,62" fill="#c0392b"/>
      </svg>
    </div>

    <!-- Glowing heart -->
    <div id="heartContainer" class="heart-container" aria-label="Click to begin">
      <svg id="heartSvg" class="heart-svg" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <radialGradient id="heartGrad" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#ff6b8a"/>
            <stop offset="60%" stop-color="#c0392b"/>
            <stop offset="100%" stop-color="#7b0d1e"/>
          </radialGradient>
          <filter id="heartGlow">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <path id="heartPath"
          d="M100,155 C60,120 10,90 10,55 C10,25 35,10 65,20 C80,25 100,40 100,40
             C100,40 120,25 135,20 C165,10 190,25 190,55 C190,90 140,120 100,155 Z"
          fill="url(#heartGrad)" filter="url(#heartGlow)" />
        <g id="crackGroup" opacity="0">
          <polyline points="100,50 95,80 108,100 98,130" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <polyline points="100,50 85,65 75,85" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <polyline points="108,100 120,95 130,110" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
      <button id="clickMeBtn" class="click-me-btn" aria-label="Begin the reel">Click me</button>
    </div>

    <!-- Arrow projectile -->
    <div id="arrow" class="arrow-projectile" aria-hidden="true">
      <svg viewBox="0 0 80 12" xmlns="http://www.w3.org/2000/svg">
        <line x1="0" y1="6" x2="64" y2="6" stroke="#8B5E3C" stroke-width="3"/>
        <polygon points="80,6 64,2 64,10" fill="#c0392b"/>
        <path d="M0,6 L8,2 M0,6 L8,10" stroke="#e8d5b0" stroke-width="1.5"/>
      </svg>
    </div>

  </section>

  <!-- ░░░  WHITE FLASH  ░░░ -->
  <div id="flashOverlay" class="flash-overlay" aria-hidden="true"></div>

  <!-- ░░░  SCENE 3 – REVEAL  ░░░ -->
  <section id="scene3" class="scene" aria-label="Reveal scene" hidden>

    <!-- Typewriter message -->
    <div id="messageWrap" class="message-wrap" aria-live="polite">
      <p id="typedMessage" class="typed-message"></p>
      <span class="cursor-blink" aria-hidden="true">|</span>
    </div>

    <!-- Film reel: outer clip → rotate wrapper → scrolling filmstrip -->
    <div id="reelWrap" class="reel-wrap" aria-label="Photo film reel">
      <div id="reelRotate" class="reel-rotate">
        <!-- .filmstrip is built entirely by JS as pure CSS/HTML elements -->
        <div id="reelTrack" class="filmstrip"></div>
      </div>
    </div>

  </section>

  <!-- Replay button – fixed, outside scene3 for safe-area support -->
  <button id="replayBtn" class="replay-btn" hidden aria-label="Replay from the beginning">↺ Replay</button>

  <script src="script.js?v=2.0.3"></script>
</body>
</html>
